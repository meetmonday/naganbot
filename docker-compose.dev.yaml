version: '3.7'
services:
    app:
        depends_on:
            - db
    db:
        image: postgres:18-alpine
        container_name: naganbot_db
        restart: on-failure
        ports:
            - $DB_PORT:5432
        volumes:
            - db_data:/var/lib/postgresql
        environment:
            - POSTGRES_DB=app
            - POSTGRES_HOST_AUTH_METHOD=trust
volumes:
    db_data:
        name: naganbot_db_data
